services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  synapse:
    build: ./docker/synapse
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./synapse:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  coturn:
    build: ./docker/coturn
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
      - ./certs:/etc/laziestmatrix/certs:ro
    command: ["-c", "/etc/turnserver.conf", "--no-cli"]
    healthcheck:
      test: ["CMD-SHELL", "turnutils_uclient -v -u health -w health 127.0.0.1 2>/dev/null || true"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
      element:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "8448:8448"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/letsencrypt:ro
      - ./synapse/media_store:/var/lib/matrix-synapse/media_store:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 20
